name: Deploy to Cloudways

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix client
          npm ci --prefix server

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  deploy:
    name: Deploy to Cloudways
    runs-on: ubuntu-latest
    needs: ci
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30

    steps:
      - name: Authenticate with Cloudways
        id: auth
        env:
          CLOUDWAYS_EMAIL: ${{ secrets.CLOUDWAYS_EMAIL }}
          CLOUDWAYS_API_KEY: ${{ secrets.CLOUDWAYS_API_KEY }}
        run: |
          set -euo pipefail
          response=$(curl -sS -w '\n%{http_code}' -X POST 'https://api.cloudways.com/api/v1/oauth/access_token' \
            -H 'Accept: application/json' \
            --data-urlencode "email=$CLOUDWAYS_EMAIL" \
            --data-urlencode "api_key=$CLOUDWAYS_API_KEY")
          status=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')
          printf 'HTTP %s\n' "$status"
          if [ "$status" != "200" ]; then
            printf 'Auth failed. Body: %s\n' "$body"
            exit 1
          fi
          token=$(printf '%s' "$body" | jq -r '.access_token // empty')
          if [ -z "$token" ]; then
            printf 'Token extraction failed. Body: %s\n' "$body"
            exit 1
          fi
          printf '::add-mask::%s\n' "$token"
          printf 'token=%s\n' "$token" >> "$GITHUB_OUTPUT"

      - name: Trigger git pull
        env:
          CW_TOKEN: ${{ steps.auth.outputs.token }}
          CW_SERVER_ID: ${{ secrets.CLOUDWAYS_SERVER_ID }}
          CW_APP_ID: ${{ secrets.CLOUDWAYS_APP_ID }}
        run: |
          set -euo pipefail
          response=$(curl -sS -w '\n%{http_code}' -X POST 'https://api.cloudways.com/api/v1/git/pull' \
            -H "Authorization: Bearer $CW_TOKEN" \
            --data-urlencode "server_id=$CW_SERVER_ID" \
            --data-urlencode "app_id=$CW_APP_ID" \
            --data-urlencode "branch_name=main" \
            --data-urlencode "deploy_path=")
          status=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')
          printf 'HTTP %s\n' "$status"
          printf '%s\n' "$body"
          case "$status" in
            200|202) ;;
            *) exit 1 ;;
          esac

      - name: Build and restart on server (SSH)
        uses: appleboy/ssh-action@v1.2.2
        env:
          APP_PATH: ${{ secrets.CLOUDWAYS_APP_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.CLOUDWAYS_SSH_HOST }}
          username: ${{ secrets.CLOUDWAYS_SSH_USER }}
          password: ${{ secrets.CLOUDWAYS_SSH_PASSWORD }}
          port: 22
          command_timeout: 25m
          envs: APP_PATH,DEPLOY_SHA
          script: |
            set -eu
            cd "$APP_PATH"
            # Wait for the Cloudways pull to land before touching anything from
            # the repo. This has to live here rather than in deploy.sh: that
            # script only reaches the server via the very pull we are waiting
            # for, so on the deploy that introduces it the old copy would run.
            # Running mid-pull also fails with EACCES, because the pull is still
            # rewriting files as another user.
            attempt=0
            synced=0
            while [ "$attempt" -lt 60 ]; do
              attempt=$((attempt + 1))
              head_sha="$(git rev-parse HEAD 2>/dev/null || echo unknown)"
              # "has at least this commit": a checkout slightly ahead still
              # contains the code being deployed.
              if [ "$head_sha" = "$DEPLOY_SHA" ] || git merge-base --is-ancestor "$DEPLOY_SHA" HEAD 2>/dev/null; then
                echo "deploy: checkout has $DEPLOY_SHA (HEAD $head_sha) after $attempt attempt(s)"
                synced=1
                break
              fi
              sleep 3
            done
            if [ "$synced" != "1" ]; then
              echo "deploy: ERROR checkout is at $(git rev-parse HEAD 2>/dev/null || echo unknown), expected $DEPLOY_SHA"
              echo "deploy: the Cloudways git pull did not land; refusing to build the wrong commit."
              exit 1
            fi
            # Let the pull settle its file permissions before npm writes here.
            sleep 5
            DEPLOY_SHA="$DEPLOY_SHA" bash scripts/deploy.sh

      - name: Purge Varnish cache
        env:
          CW_TOKEN: ${{ steps.auth.outputs.token }}
          CW_SERVER_ID: ${{ secrets.CLOUDWAYS_SERVER_ID }}
          CW_APP_ID: ${{ secrets.CLOUDWAYS_APP_ID }}
        run: |
          set -euo pipefail
          response=$(curl -sS -w '\n%{http_code}' -X POST 'https://api.cloudways.com/api/v2/app/cache/purge' \
            -H "Authorization: Bearer $CW_TOKEN" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -H 'Accept: application/json' \
            --data-urlencode "server_id=$CW_SERVER_ID" \
            --data-urlencode "app_id=$CW_APP_ID")
          status=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')
          printf 'HTTP %s\n' "$status"
          printf '%s\n' "$body"
          case "$status" in
            200|202) ;;
            *) exit 1 ;;
          esac
